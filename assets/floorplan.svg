<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980" fill="none"><style>path{fill:none}</style>
  <defs>
    <filter id="bpGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
    </filter>
    <pattern id="bpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#D9CBAF" stroke-width=".6" opacity=".07"/>
    </pattern>
    <filter id="redSmudge" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="980" fill="#0B0A08"/>
  <rect width="800" height="980" fill="url(#bpGrid)"/>
  <g font-family="STSong, 'Songti SC', SimSun, serif" fill="#D9C9A9">
