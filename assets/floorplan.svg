    <g stroke="#D9C9A9" stroke-width="1.8" opacity=".8">
      <path d="M146 180H300V334H146M300 180V280H334V180"/>
      <path d="M146 180H240V280H146"/>
      <path d="M240 180V280M146 230H240"/>
      <path d="M146 334H286M146 410H286"/>
      <path d="M146 410H240V580H146V410Z"/>
      <path d="M240 410H286V500H240V410Z"/>
      <path d="M146 580H286V700H146V580Z"/>
