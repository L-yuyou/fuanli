    <text x="336" y="690" transform="rotate(-8 336 690)" font-family="STKaiti, KaiTi, serif" font-size="25" fill="#B5392E" opacity=".88">她在这</text>
    <!-- room 03 figure mark -->
    <g opacity=".55" stroke="#B5392E" stroke-width="1.2" fill="none">
      <circle cx="231" cy="736" r="8"/>
      <path d="M231 744V773M218 785L231 770L245 786M231 758L219 763M231 758L244 761"/>
    </g>
    <!-- rooms right top -->
    <g stroke="#D9C9A9" stroke-width="1.8" opacity=".8">
      <path d="M514 334H654V470H514V334Z"/>
      <path d="M514 470H654V580H514V470Z"/>
      <path d="M654 180H514V334M514 180H600V280H514V180Z"/>
      <path d="M654 180V580M514 280H600"/>
      <path d="M514 580H654V700H514V580Z"/>
      <path d="M514 700H654V840H514V700Z"/>
      <path d="M514 760H654"/>
    </g>
    <g font-size="9" fill="#9D8F75" letter-spacing="2">
      <text x="536" y="370">书 房</text>
      <text x="536" y="502">茶 室</text>
      <text x="536" y="620">05</text><text x="556" y="620">空 房</text>
      <text x="536" y="730">06</text><text x="556" y="730">杂 物</text>
    </g>
