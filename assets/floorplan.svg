    <g stroke="#0B0A08" stroke-width="7">
      <path d="M300 180H334M514 280H600M146 580H240M654 760V820"/>
    </g>
    <g stroke="#D9C9A9" stroke-width="1">
      <path d="M300 171V189M334 171V189M600 271V289M514 271V289M146 571V589M240 571V589M654 751V829M645 760H663M645 820H663"/>
    </g>
    <!-- corridor labels -->
    <g font-size="8" fill="#8A7C64" letter-spacing="2">
      <text x="320" y="665">廊 · 十 二 步</text>
      <text x="548" y="794">尽 头</text>
