      <rect x="258" y="873" width="36" height="14"/><rect x="508" y="873" width="36" height="14"/>
    </g>
    <!-- central courtyard -->
    <g stroke="#D9C9A9" stroke-width="2">
      <path d="M286 334H514V580H286V334Z"/>
      <path d="M286 334L334 300H466L514 334"/>
      <path d="M286 580L334 614H466L514 580"/>
      <path d="M334 300V280H466V300M334 614V634H466V614"/>
    </g>
    <g fill="#D9C9A9" opacity=".5">
