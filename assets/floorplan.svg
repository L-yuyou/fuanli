      <path d="M360 780V806M458 780V806M382 780V808M436 780V808"/>
      <circle cx="384" cy="738" r="3"/><circle cx="410" cy="738" r="3"/><circle cx="436" cy="738" r="3"/>
    </g>
    <text x="364" y="728" font-size="10" fill="#BCAA8C" letter-spacing="4">供 桌</text>
    <text x="301" y="874" font-size="8" fill="#7F725C" letter-spacing="2">正 厅 · MAIN HALL</text>
