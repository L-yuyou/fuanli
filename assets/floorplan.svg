    <!-- dimensions -->
    <g stroke="#8E8068" stroke-width="1" opacity=".45">
      <path d="M106 913H694M106 905V921M694 905V921"/>
      <path d="M96 140V880M88 140H104M88 880H104"/>
    </g>
    <g font-family="'Cascadia Mono', Consolas, monospace" font-size="8" fill="#8E8068" opacity=".8">
      <text x="370" y="933">18.60 M</text>
      <text x="72" y="515" transform="rotate(-90 72 515)">24.20 M</text>
    </g>
    <!-- annotations -->
    <g font-family="STKaiti, KaiTi, serif" fill="#BDAF95" opacity=".55">
      <path d="M304 251C345 242 385 240 430 250" stroke="#BDAF95" stroke-width="1"/>
      <text x="304" y="244" font-size="10">原有木梁，未更换</text>
      <path d="M609 636C641 629 668 637 684 660" stroke="#BDAF95" stroke-width="1"/>
      <text x="610" y="630" font-size="10">此处常年锁闭</text>
    </g>
    <!-- legend -->
    <g font-family="'Cascadia Mono', Consolas, monospace" font-size="7" fill="#8E8068" opacity=".7">
      <text x="58" y="946">FIG. 03 / 测绘图 / 比例尺 1:100</text>
      <text x="58" y="960">DRAWN BY: 何氏 · REVISED 2026.11</text>
      <text x="636" y="946">NO. 0007</text>
      <text x="636" y="960">PAGE 03 / 09</text>
    </g>
    <!-- red stamp -->
    <g transform="translate(680 800) rotate(8)" opacity=".72" fill="none">
      <rect width="42" height="42" stroke="#A92F25" stroke-width="2"/>
      <text x="21" y="18" text-anchor="middle" font-family="STKaiti, KaiTi, serif" font-size="10" fill="#A92F25">未</text>
      <text x="21" y="32" text-anchor="middle" font-family="STKaiti, KaiTi, serif" font-size="10" fill="#A92F25">完</text>
    </g>
