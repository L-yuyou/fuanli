    <text x="58" y="50" font-size="16" letter-spacing="4" opacity=".78">福安里 · 宅院平面图</text>
    <text x="58" y="72" font-size="9" fill="#97896F" letter-spacing="2.5">FU'ANLI COURTYARD · SURVEYED 1937 · SCALE 1:100</text>
    <path d="M58 84H742" stroke="#7E7058" stroke-width="1" opacity=".45"/>
    <!-- outer walls -->
    <g stroke="#D9C9A9" stroke-width="3">
